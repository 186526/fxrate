# 发布 Docker 镜像：仅在 release tag（v*）发布时构建，镜像 tag 用版本号。
# push main 不再触发构建——开发环境用 CI 检查保证质量，发版走 GitHub Release。
# Phase 6 发布门禁：build 前必须通过 reusable CI（ci.yml 的 workflow_call，lint/
# typecheck/确定性单测/dist 一致性/build 任一失败即红）；镜像构建（push:false + load）
# 后先对「精确发布镜像」起容器跑确定性 image smoke（/info、/readyz 契约、/metrics
# 8 family、JSON-RPC instanceInfo；只验契约形状，不等真实银行就绪），smoke 通过后对
# 同一批 tag 逐个 `docker push`——推送的是被 smoke 过的同一构建产物，绝不重新构建。
# concurrency 按 ref 串行：release: published 与 push: tags v* 同 ref 并发时不竞态。
name: Create and publish a Docker image

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  build-smoke-push:
    runs-on: ubuntu-latest
    needs: gates
    # 最小权限：contents read（checkout）+ packages write（push）+ attestation 所需。
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 重新构建 dist：确保镜像内 GITBUILD/BUILDTIME 与当前 tag 一致
      # （dist 虽提交进仓库，但 GITBUILD 注入的是构建时 HEAD，tag 场景必须重建）
      - name: Build dist
        run: yarn build

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # release tag -> :0.0.8 + :0.0 + :sha-<short>；非预发布 v*（无 '-'）额外 :latest。
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      # GHA cache export（--cache-to type=gha）需要 docker-container 驱动：
      # runner 默认 docker 驱动会报 "Cache export is not supported for the docker driver"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      # 只构建不推送（load 进本地 daemon 供 smoke），smoke 通过后对同一批 tag 逐个
      # docker push——同一构建产物，绝不二次构建。cache-from/to 加速热 runner 复建。
      - name: Build release image (no push)
        id: build
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 确定性 smoke：精确发布镜像 /info、/readyz 契约、/metrics 8 family、JSON-RPC。
      - name: Smoke exact release image (deterministic, no live banks)
        run: |
          RELEASE_TAG=$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n1)
          bash scripts/image-smoke.sh --skip-build --image "$RELEASE_TAG"

      # 推送被 smoke 过的精确 tag（本地 daemon 内同一产物），不重新构建。
      - name: Push exact smoke-tested image
        id: push
        run: |
          set -euo pipefail
          FIRST_TAG=$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n1)
          for tag in $(printf '%s\n' '${{ steps.meta.outputs.tags }}'); do
            docker push "$tag"
          done
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$FIRST_TAG" | sed 's/^.*@//')
          [ -n "$digest" ] || { echo "::error::failed to resolve pushed digest" >&2; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # This step generates an artifact attestation for the image, which is an unforgeable statement about where and how it was built. It increases supply chain security for people who consume the image. For more information, see "[AUTOTITLE](/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds)."
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
